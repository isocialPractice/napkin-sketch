<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>napkin-sketch</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app" class="app">
      <header id="toolbar" class="toolbar" role="toolbar" aria-label="Sketch tools">
        <section id="tool-group" class="group" aria-label="Tools">
          <button id="tool-pen" class="tool" type="button" title="Pen (P)" aria-label="Pen">
            <span class="icon" aria-hidden="true">✎</span><span class="label">Pen</span>
          </button>
          <button id="tool-marker" class="tool" type="button" title="Marker (M)" aria-label="Marker">
            <span class="icon" aria-hidden="true">▰</span><span class="label">Marker</span>
          </button>
          <button id="tool-copic" class="tool" type="button" title="Copic marker (K)" aria-label="Copic marker">
            <span class="icon" aria-hidden="true">◪</span><span class="label">Copic</span>
          </button>
          <button id="tool-eraser" class="tool" type="button" title="Eraser (E)" aria-label="Eraser">
            <span class="icon" aria-hidden="true">⌫</span><span class="label">Eraser</span>
          </button>
          <button id="tool-select" class="tool" type="button" title="Select (S)" aria-label="Select">
            <span class="icon" aria-hidden="true">⤢</span><span class="label">Select</span>
          </button>
          <button id="tool-point" class="tool" type="button" title="Direct Select (A) — select and move anchor points" aria-label="Direct Select">
            <span class="icon" aria-hidden="true">▷</span><span class="label">Direct</span>
          </button>
          <button id="tool-text" class="tool" type="button" title="Text (T)" aria-label="Text">
            <span class="icon" aria-hidden="true">T</span><span class="label">Text</span>
          </button>
        </section>

        <section id="sketch-group" class="group" aria-label="Sketch support">
          <button id="tool-rect" class="tool" type="button" title="Rectangle (R) — hold Shift for a square" aria-label="Rectangle">
            <span class="icon" aria-hidden="true">▭</span><span class="label">Rect</span>
          </button>
          <button id="tool-ellipse" class="tool" type="button" title="Ellipse (L) — hold Shift for a circle" aria-label="Ellipse">
            <span class="icon" aria-hidden="true">◯</span><span class="label">Ellipse</span>
          </button>
          <button id="tool-curve" class="tool has-flyout" type="button" title="Curve (V) — drag a chord (ends snap to stroke endpoints), then bend and click. Click and hold for curve options" aria-label="Curve">
            <span class="icon" aria-hidden="true">⌒</span><span class="label">Curve</span>
          </button>
          <button id="tool-vector" class="tool" type="button" title="Vector Path (B) — click for corner points, drag for smooth curves; click the first point to close, Enter or double-click to finish, Esc cancels" aria-label="Vector Path">
            <span class="icon" aria-hidden="true">✒</span><span class="label">Vector Path</span>
          </button>
          <button id="tool-bucket" class="tool" type="button" title="Paint Bucket (G) — fill an enclosed shape" aria-label="Paint Bucket">
            <span class="icon" aria-hidden="true">🪣</span><span class="label">Paint Bucket</span>
          </button>
          <button id="tool-fill" class="tool" type="button" title="Fill Color — fill the selected element with the selected color" aria-label="Fill Color">
            <span class="icon" aria-hidden="true">◧</span><span class="label">Fill Color</span>
          </button>
          <button id="tool-eyedrop" class="tool" type="button" title="Eyedropper (I) — pick a color; fills the selected shape" aria-label="Eyedropper">
            <span class="icon" aria-hidden="true">💧</span><span class="label">Pick</span>
          </button>
          <button id="join-strokes" class="btn" type="button" title="Join selected strokes (Ctrl+J)">
            Join
          </button>
          <button id="close-shape" class="btn" type="button" title="Close Shape - join the selected stroke's two end points (press for Sharp or Smooth)">
            Close Shape
          </button>
          <label id="vector-options" class="vector-options is-hidden" for="vector-radius" title="Corner radius — rounds the selected Vector Path anchor">
            <span class="slider-text">Radius</span>
            <input id="vector-radius" type="number" min="0" max="999" step="1" value="12" aria-label="Corner radius" />
          </label>
        </section>

        <section class="group" aria-label="Ink color">
          <div id="swatches" class="swatches"></div>
          <label class="custom-color" title="Custom ink color">
            <input id="color-custom" type="color" value="#1f2328" aria-label="Custom ink color" />
          </label>
        </section>

        <section class="group" aria-label="Stroke width">
          <label class="slider" for="width">
            <span class="slider-text">Width</span>
            <input id="width" type="range" min="1" max="40" step="1" value="3" />
            <span id="width-value" class="slider-value">3px</span>
          </label>
        </section>

        <section class="group" aria-label="Auto sharpen">
          <button id="sharpen-all" class="btn btn-accent" type="button" title="Sharpen every stroke (H)">
            Sharpen all
          </button>
          <button id="sharpen-selection" class="btn" type="button" title="Sharpen Selection — smooth and simplify the selected strokes with a live preview">
            Sharpen Selection
          </button>
          <button id="settings-toggle" class="btn" type="button" title="Quick Settings (Ctrl+,)">
            Quick Settings
          </button>
        </section>

        <section class="group" aria-label="History">
          <button id="undo" class="btn" type="button" title="Undo (Ctrl+Z)">Undo</button>
          <button id="redo" class="btn" type="button" title="Redo (Ctrl+Y)">Redo</button>
          <button id="clear" class="btn" type="button" title="Clear page">Clear</button>
        </section>

        <section class="group group-right" aria-label="File">
          <button id="pages-toggle" class="btn btn-panel" type="button" title="Toggle pages panel (Ctrl+B)">Pages</button>
          <button id="layers-toggle" class="btn btn-panel" type="button" title="Toggle layers panel (Ctrl+L)">Layers</button>
          <button id="properties-toggle" class="btn btn-panel" type="button" title="Toggle properties panel (Ctrl+P)">Properties</button>
          <span class="toolbar-sep" role="separator" aria-orientation="vertical"></span>
          <button id="new-sketch" class="btn" type="button" title="New sketch">New</button>
          <button id="open" class="btn" type="button" title="Open sketch book">Open</button>
          <button id="import" class="btn" type="button" title="Import SVG, PDF, PNG, or JPEG (Ctrl+I)">Import</button>
          <button id="export" class="btn" type="button" title="Export as PNG, JPEG, SVG, or PDF">Export</button>
          <button id="save" class="btn btn-strong" type="button" title="Save (Ctrl+S)">Save</button>
          <button id="save-as" class="btn" type="button" title="Save as (Ctrl+Shift+S)">Save As</button>
          <button id="app-settings" class="btn btn-ghost" type="button" title="Verbose Settings" aria-label="Open verbose settings">
            <span class="icon" aria-hidden="true">⚙</span>
          </button>
        </section>
      </header>

      <div class="body">
        <aside id="side-rail" class="side-rail" aria-label="Side toolbar"></aside>

        <aside id="pages-panel" class="pages-panel" aria-label="Pages">
          <div id="pages-resize" class="panel-resize panel-resize-right" title="Drag to resize the pages panel" aria-hidden="true"></div>
          <div class="pages-panel-head">
            <span>Pages</span>
            <div class="pages-panel-actions">
              <button id="new-page" class="btn btn-ghost" type="button" title="Add page">+ Page</button>
              <button id="delete-page" class="btn btn-ghost" type="button" title="Delete page">Delete</button>
            </div>
          </div>
          <div id="thumbs" class="thumbs"></div>
        </aside>

        <main id="stage" class="stage">
          <div id="canvas-wrap" class="canvas-wrap">
            <canvas id="canvas" aria-label="Drawing surface"></canvas>
          </div>
        </main>

        <aside id="layers-panel" class="layers-panel" aria-label="Layers">
          <div id="layers-resize" class="panel-resize" title="Drag to resize the layers panel" aria-hidden="true"></div>
          <div class="pages-panel-head">
            <span>Layers</span>
            <div class="pages-panel-actions">
              <button id="add-layer" class="btn btn-ghost" type="button" title="Add layer">+ Layer</button>
              <button id="group-layer" class="btn btn-ghost" type="button" title="Group the active layer (Ctrl+G)">Group</button>
              <button id="delete-layer" class="btn btn-ghost" type="button" title="Delete selected layers">Delete</button>
            </div>
          </div>
          <div id="layers-list" class="layers-list" role="listbox" aria-label="Layer stack"></div>
          <div class="layers-foot">
            <div class="layers-move">
              <button id="layer-up" class="btn btn-ghost" type="button" title="Move layer up">▲</button>
              <button id="layer-down" class="btn btn-ghost" type="button" title="Move layer down">▼</button>
            </div>
            <label class="layers-opacity" for="layer-opacity">
              <span>Opacity</span>
              <input id="layer-opacity" type="range" min="5" max="100" step="1" value="100" />
              <span id="layer-opacity-value">100%</span>
            </label>
          </div>
        </aside>

        <aside id="properties-panel" class="properties-panel" aria-label="Properties">
          <div id="properties-resize" class="panel-resize" title="Drag to resize the properties panel" aria-hidden="true"></div>
          <div class="pages-panel-head">
            <span>Properties</span>
            <div class="pages-panel-actions">
              <button id="properties-close" class="btn btn-ghost" type="button" title="Hide properties panel" aria-label="Hide properties panel">✕</button>
            </div>
          </div>

          <div class="properties-body">
            <p id="prop-summary" class="prop-summary">Nothing selected</p>

            <div id="prop-fields" class="prop-fields">
              <section class="prop-section" aria-labelledby="prop-position-title">
                <h3 id="prop-position-title" class="prop-title">Position</h3>
                <div class="prop-row">
                  <label class="prop-field" for="prop-x"><span>X</span></label>
                  <input id="prop-x" class="prop-num" type="number" step="0.1" aria-label="X position" />
                  <select id="prop-x-unit" class="prop-unit" aria-label="X position unit"></select>
                </div>
                <div class="prop-row">
                  <label class="prop-field" for="prop-y"><span>Y</span></label>
                  <input id="prop-y" class="prop-num" type="number" step="0.1" aria-label="Y position" />
                  <select id="prop-y-unit" class="prop-unit" aria-label="Y position unit"></select>
                </div>
              </section>

              <section class="prop-section" aria-labelledby="prop-appearance-title">
                <h3 id="prop-appearance-title" class="prop-title">Appearance</h3>

                <p class="prop-subtitle">Fill</p>
                <div class="prop-row">
                  <input id="prop-fill" class="prop-color" type="color" value="#1f2328" aria-label="Fill color" />
                  <button id="prop-fill-remove" class="btn btn-ghost" type="button" title="Remove the fill">No fill</button>
                  <button id="prop-fill-gradient" class="btn btn-ghost" type="button" title="Fill with a gradient">Gradient</button>
                </div>

                <div id="gradient-editor" class="gradient-editor is-hidden">
                  <div id="gradient-bar" class="gradient-bar" role="group" aria-label="Gradient stops" title="Drag a handle to move a stop; double-click the bar to add one"></div>
                  <div class="prop-row">
                    <input id="gradient-stop-color" class="prop-color" type="color" value="#1f2328" aria-label="Selected stop color" />
                    <input id="gradient-stop-offset" class="prop-num" type="number" min="0" max="100" step="1" value="0" aria-label="Selected stop position, percent" />
                    <span class="prop-unit-static">%</span>
                    <button id="gradient-add-stop" class="btn btn-ghost" type="button" title="Add a stop">+</button>
                    <button id="gradient-remove-stop" class="btn btn-ghost" type="button" title="Remove the selected stop">−</button>
                  </div>
                  <div class="prop-row">
                    <select id="gradient-type" class="prop-unit prop-unit-wide" aria-label="Gradient type">
                      <option value="linear">Linear</option>
                      <option value="radial">Radial</option>
                    </select>
                    <button id="gradient-remove" class="btn btn-ghost" type="button" title="Remove the gradient">Remove</button>
                  </div>
                  <div id="gradient-angle-row" class="prop-row">
                    <label class="prop-field" for="gradient-angle"><span>Angle</span></label>
                    <input id="gradient-angle" type="range" min="0" max="359" step="1" value="0" />
                    <span id="gradient-angle-value" class="prop-value">0°</span>
                  </div>
                </div>

                <p class="prop-subtitle">Stroke</p>
                <div class="prop-row">
                  <label class="prop-field" for="prop-stroke-width"><span>Width</span></label>
                  <input id="prop-stroke-width" class="prop-num" type="number" min="0.5" max="400" step="0.5" aria-label="Stroke width in pixels" />
                  <span class="prop-unit-static">px</span>
                </div>
                <div class="prop-row">
                  <select id="prop-stroke-style" class="prop-unit prop-unit-wide" aria-label="Stroke style">
                    <option value="solid">Solid</option>
                    <option value="dashed">Dashed</option>
                    <option value="dotted">Dotted</option>
                  </select>
                  <button id="prop-stroke-remove" class="btn btn-ghost" type="button" title="Remove the outline">No stroke</button>
                </div>
              </section>

              <section class="prop-section" aria-labelledby="prop-scale-title">
                <h3 id="prop-scale-title" class="prop-title">Scale</h3>
                <div class="prop-row">
                  <label class="prop-field" for="prop-scale-x"><span>X</span></label>
                  <input id="prop-scale-x" class="prop-num" type="number" min="0" step="1" aria-label="Horizontal scale" />
                  <select id="prop-scale-x-unit" class="prop-unit" aria-label="Horizontal scale unit"></select>
                </div>
                <div class="prop-row">
                  <label class="prop-field" for="prop-scale-y"><span>Y</span></label>
                  <input id="prop-scale-y" class="prop-num" type="number" min="0" step="1" aria-label="Vertical scale" />
                  <select id="prop-scale-y-unit" class="prop-unit" aria-label="Vertical scale unit"></select>
                </div>
                <label class="switch prop-switch" title="Scale both axes together">
                  <input id="prop-scale-uniform" type="checkbox" checked />
                  <span class="switch-track" aria-hidden="true"></span>
                  <span class="switch-text">Uniform scaling</span>
                </label>
              </section>
            </div>
          </div>
        </aside>

        <aside id="settings-panel" class="settings-panel is-hidden" aria-label="Quick settings">
          <div class="settings-head">
            <span>Quick Settings</span>
            <button id="settings-close" class="btn btn-ghost" type="button" aria-label="Close settings">✕</button>
          </div>

          <label class="switch settings-row" title="Auto-sharpen each stroke as you draw">
            <input id="live-sharpen" type="checkbox" />
            <span class="switch-track" aria-hidden="true"></span>
            <span class="switch-text">Live sharpen</span>
          </label>

          <label class="settings-field">
            <span>Wobble</span>
            <input id="set-wobble" type="range" min="0" max="4" step="0.1" value="1.1" />
          </label>
          <label class="settings-field">
            <span>Smoothing</span>
            <input id="set-simplify" type="range" min="0.5" max="8" step="0.5" value="2.5" />
          </label>
          <label class="settings-field">
            <span>Circle snap</span>
            <input id="set-circle" type="range" min="0.02" max="0.3" step="0.01" value="0.12" />
          </label>
          <label class="switch settings-row">
            <input id="set-taper" type="checkbox" checked />
            <span class="switch-track" aria-hidden="true"></span>
            <span class="switch-text">Taper stroke ends</span>
          </label>

          <hr class="settings-sep" />

          <label class="settings-field">
            <span>Symmetry <em id="set-symmetry-value">off</em></span>
            <input id="set-symmetry" type="range" min="1" max="12" step="1" value="1" />
          </label>
          <label class="settings-field">
            <span>Text size</span>
            <input id="set-fontsize" type="range" min="10" max="96" step="1" value="24" />
          </label>
        </aside>
      </div>

      <footer class="statusbar">
        <div class="status-left">
          <span class="status-icon" aria-hidden="true">▤</span>
          <span id="status-name" class="status-name">untitled</span>
          <span id="status-dirty" class="status-dirty">Saved</span>
        </div>
        <div class="pages" aria-label="Page navigation">
          <button id="prev-page" class="btn btn-ghost" type="button" title="Previous page">‹</button>
          <span id="page-indicator" class="page-indicator">Page 1 / 1</span>
          <button id="next-page" class="btn btn-ghost" type="button" title="Next page">›</button>
        </div>
      </footer>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>

      <!-- Copic nib rotation indicator (visible while quick nib-rotate is active) -->
      <div id="nib-indicator" class="nib-indicator is-hidden" role="status" aria-live="polite" aria-label="Copic nib rotation">
        <span class="nib-indicator-dial" aria-hidden="true">
          <span id="nib-indicator-bar" class="nib-indicator-bar"></span>
        </span>
        <span id="nib-indicator-value" class="nib-indicator-value">45°</span>
      </div>

      <!-- Sharpen Selection dialog: sits in a corner so the live preview on
           the canvas stays visible while the sliders move -->
      <div id="sharpen-dialog" class="export-dialog dialog-corner is-hidden" role="dialog" aria-label="Sharpen Selection">
        <div class="export-dialog-inner">
          <p class="export-dialog-title">Sharpen Selection</p>
          <label class="settings-field">
            <span>Smooth</span>
            <input id="sharpen-smooth" type="range" min="0" max="10" step="1" value="4" />
          </label>
          <label class="settings-field">
            <span>Simplify</span>
            <input id="sharpen-simplify" type="range" min="0" max="10" step="0.5" value="2" />
          </label>
          <div class="export-dialog-actions">
            <button id="sharpen-apply-btn" class="btn btn-primary" type="button">Apply</button>
            <button id="sharpen-cancel-btn" class="btn btn-ghost" type="button">Cancel</button>
          </div>
        </div>
      </div>

      <!-- Page Settings dialog: toggle a page between endless and sized -->
      <div id="page-settings-dialog" class="export-dialog dialog-corner is-hidden" role="dialog" aria-label="Page Settings">
        <div class="export-dialog-inner">
          <p class="export-dialog-title">Page Settings</p>
          <label class="switch settings-row" title="Sized pages keep an exact width and height; endless pages fill the window">
            <input id="page-sized" type="checkbox" />
            <span class="switch-track" aria-hidden="true"></span>
            <span class="switch-text">Sized page</span>
          </label>
          <label class="settings-field page-dim">
            <span>Width</span>
            <input id="page-width" type="number" min="64" max="8192" step="1" value="1280" disabled />
          </label>
          <label class="settings-field page-dim">
            <span>Height</span>
            <input id="page-height" type="number" min="64" max="8192" step="1" value="800" disabled />
          </label>
          <div class="export-dialog-actions">
            <button id="page-settings-apply" class="btn btn-primary" type="button">Apply</button>
            <button id="page-settings-close" class="btn btn-ghost" type="button">Close</button>
          </div>
        </div>
      </div>

      <!-- Right-click context menu (layers and pages panels) -->
      <div id="context-menu" class="context-menu is-hidden" role="menu"></div>

      <!-- Export page-selection dialog -->
      <div id="export-dialog" class="export-dialog is-hidden" role="dialog" aria-modal="true" aria-label="Export options">
        <div class="export-dialog-inner">
          <p class="export-dialog-title">Export as <strong id="export-fmt">PNG</strong></p>
          <div class="export-dialog-actions">
            <button id="export-page-btn" class="btn btn-primary" type="button">
              Export Page <span id="export-page-label">1</span>
            </button>
            <button id="export-all-btn" class="btn" type="button">Export All Pages</button>
            <button id="export-cancel-btn" class="btn btn-ghost" type="button">Cancel</button>
          </div>
        </div>
      </div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
