<?xml version="1.0" encoding="UTF-8"?>
<!--
  Two filled squares overlapping, for the Wipe Stacks check: a red one at the
  bottom and a blue one above it, each a quarter of the other's area over it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220">
  <g id="squares" data-name="squares">
    <rect id="below" x="20" y="20" width="140" height="140" fill="#d0342c"/>
    <rect id="above" x="90" y="70" width="140" height="140" fill="#27486d"/>
  </g>
</svg>
