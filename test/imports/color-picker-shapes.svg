<?xml version="1.0" encoding="UTF-8"?>
<!--
  One closed shape and one open stroke, for the colour-picker check.

  A colour picked with a selection made fills a closed shape and recolours an
  open stroke. Both start in napkin's default ink, so after a pick nothing on
  the page may still be drawn in it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100">
  <g id="shapes" data-name="shapes">
    <rect id="square" x="10" y="10" width="80" height="80" fill="#1f2328"/>
    <path id="tick" d="M120 20 L150 80 L190 20" fill="none" stroke="#1f2328" stroke-width="8"/>
  </g>
</svg>
