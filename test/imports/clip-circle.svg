<?xml version="1.0" encoding="UTF-8"?>
<!--
  A clipping mask as another editor writes one, for the clipping check: a
  blue rectangle in a group clipped to a circle in its middle. The circle is
  only a clip path, so it has no paint of its own.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220">
  <defs>
    <clipPath id="porthole">
      <circle cx="120" cy="100" r="60"/>
    </clipPath>
  </defs>
  <g id="window" data-name="window" clip-path="url(#porthole)">
    <rect x="20" y="20" width="200" height="160" fill="#27486d"/>
  </g>
</svg>
