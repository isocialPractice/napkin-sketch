<?xml version="1.0" encoding="UTF-8"?>
<!--
  The clipping check's shapes: a filled blue rectangle on the bottom layer and
  a red circle outline on the layer above it, to clip the rectangle with.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220">
  <g id="art" data-name="art">
    <rect x="20" y="20" width="200" height="160" fill="#27486d"/>
  </g>
  <g id="window" data-name="window">
    <circle cx="120" cy="100" r="60" fill="none" stroke="#d0342c" stroke-width="3"/>
  </g>
</svg>
