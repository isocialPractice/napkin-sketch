<?xml version="1.0" encoding="UTF-8"?>
<!--
  A minimal gradient-painted drawing, for the import check.

  Every visible shape here is painted by a paint server rather than a flat
  colour, which is exactly the shape of artwork that used to import as an
  invisible ghost: correct geometry, correct layer tree, nothing painted. One
  linear gradient, one radial, and one that inherits another's stops through
  `href`, which is how editors emit a family of gradients sharing a ramp.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 120 80">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d2ae"/>
      <stop offset="1" stop-color="#8a4d2c"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" stop-color="#2c3126"/>
    </radialGradient>
    <linearGradient id="inherited" xlink:href="#skin" x1="0" y1="0" x2="1" y2="0"/>
  </defs>
  <g id="gradient-figure" data-name="gradient-figure">
    <g id="linear-part" data-name="linear-part">
      <path id="linear" d="M10 10 H50 V50 H10 Z" fill="url(#skin)"/>
    </g>
    <g id="radial-part" data-name="radial-part">
      <path id="radial" d="M60 10 H100 V50 H60 Z" fill="url(#glow)"/>
    </g>
    <g id="inherited-part" data-name="inherited-part">
      <path id="inherit" d="M10 58 H100 V72 H10 Z" fill="url('#inherited')"/>
    </g>
  </g>
</svg>
