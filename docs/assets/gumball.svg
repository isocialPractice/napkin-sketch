<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="gumball-title gumball-desc">
  <title id="gumball-title">The 3D gumball</title>
  <desc id="gumball-desc">The gumball on a 3D mark turned Off-Axis Front: an arrow, a scale box, a square and an arc for each of the X, Y and Z axes in red, green and blue, the ball in the middle and the ring round it all, each numbered for the list beside it.</desc>
  <rect x="0.5" y="0.5" width="639" height="399" rx="12" fill="#fcfaf5" stroke="#d0d7de"/>

  <!-- The ring: a free turn. -->
  <circle cx="220" cy="190" r="166.4" fill="none" stroke="#27496d" stroke-opacity="0.6" stroke-width="1.6"/>

  <!-- The arcs, a quarter turn round each axis: X's from Y to Z, Y's from Z to X, Z's from X to Y. -->
  <g fill="none" stroke-width="3.2" stroke-linecap="round">
    <path d="M220.1 269.9C199.2 281.3 182.2 254.8 182.1 210.6" stroke="#d8343e"/>
    <path d="M182.1 210.6C223 216.4 273.1 211.8 294.1 200.4" stroke="#2b9a3f"/>
    <path d="M294.1 200.4C294.1 244.5 261 275.7 220.1 269.9" stroke="#2f6feb"/>
  </g>

  <!-- The squares between two axes: across X red, across Y green, across Z blue. -->
  <g stroke-width="1.6" stroke-linejoin="round">
    <polygon points="207.3 223.8 207.3 243.8 197.8 249 197.8 229" fill="#d8343e" fill-opacity="0.55" stroke="#d8343e"/>
    <polygon points="232.2 200.4 222.7 205.6 241.2 208.2 250.7 203" fill="#2b9a3f" fill-opacity="0.55" stroke="#2b9a3f"/>
    <polygon points="245 220.4 263.5 223 263.5 243 245 240.4" fill="#2f6feb" fill-opacity="0.55" stroke="#2f6feb"/>
  </g>

  <!-- The arrows, the farthest first - Y points away from the eye, so it is fainter - each with its scale box past its point. -->
  <g stroke-width="3.2" stroke-linecap="round">
    <g opacity="0.8" stroke="#2b9a3f" fill="#2b9a3f">
      <path d="M220 206.9L220.2 277.6"/>
      <polygon points="220.2 297.6 213 277.6 227.4 277.6" stroke="none"/>
      <rect x="213" y="311.9" width="14.4" height="14.4" stroke="none"/>
    </g>
    <g stroke="#d8343e" fill="#d8343e">
      <path d="M235.7 192.2L301.2 201.4"/>
      <polygon points="319.7 204 300.2 208.5 302.2 194.3" stroke="none"/>
      <rect x="332.4" y="199.6" width="14.4" height="14.4" stroke="none"/>
    </g>
    <g stroke="#2f6feb" fill="#2f6feb">
      <path d="M212 194.4L178.4 212.6"/>
      <polygon points="168.9 217.8 175 206.3 181.9 218.9" stroke="none"/>
      <rect x="151.5" y="216.1" width="14.4" height="14.4" stroke="none"/>
    </g>
  </g>

  <!-- The ball. -->
  <circle cx="220" cy="190" r="11.2" fill="#ffffff" stroke="#27496d" stroke-width="2.4"/>

  <!-- The numbers, each beside its part. -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="270" cy="178" r="9" fill="#1f2328"/><text x="270" y="182">1</text>
    <circle cx="358" cy="188" r="9" fill="#1f2328"/><text x="358" y="192">2</text>
    <circle cx="280" cy="230" r="9" fill="#1f2328"/><text x="280" y="234">3</text>
    <circle cx="288" cy="272" r="9" fill="#1f2328"/><text x="288" y="276">4</text>
    <circle cx="196" cy="168" r="9" fill="#1f2328"/><text x="196" y="172">5</text>
    <circle cx="350" cy="60" r="9" fill="#1f2328"/><text x="350" y="64">6</text>
  </g>

  <!-- What each does. -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#57606a">
    <g transform="translate(410 44)">
      <circle cx="9" cy="-4" r="9" fill="#1f2328"/><text x="9" y="0" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">1</text>
      <text x="26" y="0" fill="#1f2328" font-weight="600">Arrow</text>
      <text x="26" y="17">moves it along its axis</text>
    </g>
    <g transform="translate(410 92)">
      <circle cx="9" cy="-4" r="9" fill="#1f2328"/><text x="9" y="0" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">2</text>
      <text x="26" y="0" fill="#1f2328" font-weight="600">Box</text>
      <text x="26" y="17">scales it along its axis</text>
    </g>
    <g transform="translate(410 140)">
      <circle cx="9" cy="-4" r="9" fill="#1f2328"/><text x="9" y="0" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">3</text>
      <text x="26" y="0" fill="#1f2328" font-weight="600">Square</text>
      <text x="26" y="17">moves it in its plane;</text>
      <text x="26" y="33">Alt scales it in the plane</text>
    </g>
    <g transform="translate(410 204)">
      <circle cx="9" cy="-4" r="9" fill="#1f2328"/><text x="9" y="0" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">4</text>
      <text x="26" y="0" fill="#1f2328" font-weight="600">Arc</text>
      <text x="26" y="17">turns it about its axis;</text>
      <text x="26" y="33">Shift turns 15 degrees a step</text>
    </g>
    <g transform="translate(410 268)">
      <circle cx="9" cy="-4" r="9" fill="#1f2328"/><text x="9" y="0" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">5</text>
      <text x="26" y="0" fill="#1f2328" font-weight="600">Ball</text>
      <text x="26" y="17">moves it across the view;</text>
      <text x="26" y="33">Shift scales it whole;</text>
      <text x="26" y="49">a double-click opens 3D Options</text>
    </g>
    <g transform="translate(410 348)">
      <circle cx="9" cy="-4" r="9" fill="#1f2328"/><text x="9" y="0" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">6</text>
      <text x="26" y="0" fill="#1f2328" font-weight="600">Ring</text>
      <text x="26" y="17">turns it freely, as a trackball</text>
    </g>
  </g>
  <text x="24" y="384" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#57606a">X red, Y green, Z blue: the solid's own axes</text>
</svg>
