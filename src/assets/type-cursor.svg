  <g fill="none" stroke-linecap="round">
    <path d="M9 4.5H15M9 19.5H15M12 4.5V19.5M10 15.5H14" stroke="#ffffff" stroke-width="3.4" />
    <path d="M9 4.5H15M9 19.5H15M12 4.5V19.5M10 15.5H14" stroke="#1f2328" stroke-width="1.4" />
  </g>
</svg>
